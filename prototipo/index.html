<meta charset="utf-8">
<title>Green &amp; Red Operación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
/* Layout: encabezado con logo y pestañas de texto; contenido centrado (1180px como grtomatoes.com), secciones separadas por líneas finas, sin tarjetas. Tema único claro: crema de la marca. */
:root{
  color-scheme:light;
  --bg:#F7EFDF; --surface:#FBF6EC; --sunk:#EFE5D0; --kraft:#E8D4AC;
  --ink:#1D3A27; --ink-2:#2C4A34; --text:#2A2A20; --muted:#6B6650; --line:rgba(29,58,39,.14); --line-strong:rgba(29,58,39,.32);
  --terra:#C0532F; --terra-soft:#F3DCCF; --mustard:#9A6A12; --mustard-soft:#F3E3BE; --olive:#56653F; --olive-soft:#E2E5D2;
  --paper:#FFFFFF; --paper-ink:#111111;
  --f-serif:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-sans:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond:"Oswald", "Arial Narrow", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-cond);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--terra)}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand img{height:38px;width:auto;display:block}
.brand .wordmark{font-family:var(--f-serif);font-weight:700;font-size:19px}
.brand .sep{width:1px;height:26px;background:var(--line-strong)}
.brand .app{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.proto{font-family:var(--f-cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mustard);border:1px solid currentColor;padding:2px 8px;border-radius:99px}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{border:1px solid transparent;background:transparent;padding:8px 16px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* oficina */
.office{display:block}
.nav{max-width:1180px;margin:0 auto;display:flex;gap:26px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:14px 0 12px;border-bottom:2px solid transparent;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.nav .count{font-family:var(--f-cond);font-size:12px;color:var(--terra)}
.main{min-width:0;max-width:1180px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head > div{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted);max-width:62ch}
.panel{min-width:0;border-top:1px solid var(--line-strong);padding-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.kpi{padding:18px 20px 18px 0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.kpi + .kpi{padding-left:20px;border-left:1px solid var(--line)}
.kpi > span:first-child{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.kpi b{font-family:var(--f-cond);font-size:40px;font-weight:500;line-height:1.1;color:var(--ink)}
.kpi.bad b{color:var(--terra)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:48px}
.grid2b{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:1000px){.grid2,.grid2b{grid-template-columns:1fr;gap:36px}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-family:var(--f-cond);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.cat-row td{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--terra);padding-top:22px;border-bottom:1px solid var(--line-strong)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ok{color:var(--olive)}
.warn{color:var(--mustard)}
.bad{color:var(--terra)}
.neutral{color:var(--muted)}
.neutral::before{background:transparent;border:1.5px solid currentColor}
.neg{color:var(--terra);font-weight:600}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 20px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--terra);color:var(--terra)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed{display:flex;flex-direction:column}
.feed div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border-bottom:0}
.feed time{color:var(--muted);font-family:var(--f-cond);letter-spacing:.04em;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{border-left:2px solid var(--line-strong);padding:4px 0 4px 12px;font-size:13.5px;color:var(--muted)}
.err{border-left:2px solid var(--terra);padding:4px 0 4px 12px;color:var(--terra);font-size:13.5px;font-weight:600}

.step{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:transparent;width:38px;height:38px;font-size:19px;color:var(--ink)}
.step button:hover{background:var(--sunk)}
.step input{border:0;border-radius:0;width:54px;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums;font-weight:600;background:transparent}
.thumb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-cond);font-weight:500;font-size:13px;letter-spacing:.04em;flex:none;background:var(--sunk);color:var(--ink)}
.c-beb,.c-boq,.c-bim,.c-pos,.c-var{background:var(--sunk);color:var(--ink)}
.prod{display:flex;align-items:center;gap:12px;min-width:0}
.prod span{min-width:0}

/* etiquetas físicas (siempre blanco y negro) */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.label{background:var(--paper);color:var(--paper-ink);border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-family:var(--f-sans)}
.label .lt{display:flex;justify-content:space-between;font-family:var(--f-cond);font-size:11px;letter-spacing:.1em}
.label .ln{font-family:var(--f-serif);font-weight:700;font-size:17px;line-height:1.2}
.label .lu{font-size:12.5px}
.label svg{width:100%;height:64px}
.label .lc{font-family:var(--f-mono);font-size:12px;text-align:center}

/* tablet */
.tab-stage{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.device{width:100%;max-width:1080px;background:var(--surface);border:10px solid var(--ink);border-radius:34px;overflow:hidden;min-height:680px;display:flex;flex-direction:column}
@media (max-width:640px){.device{border-width:1px;border-color:var(--line-strong);border-radius:var(--r)}}
.t-top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.t-top .who{font-family:var(--f-serif);font-weight:700;font-size:24px;color:var(--ink)}
.t-top .sub{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.net{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;background:transparent;color:var(--olive)}
.net.off{border-color:var(--terra);background:var(--terra);color:#fff}
.net i{width:8px;height:8px;border-radius:50%;background:currentColor}
.t-body{flex:1;padding:30px;display:flex;flex-direction:column;gap:22px;min-width:0}
.t-body h1{font-size:32px}
@media (max-width:640px){.t-body{padding:18px}}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:640px){.big-actions{grid-template-columns:1fr}}
.big{border:1px solid var(--line-strong);background:var(--bg);border-radius:24px;padding:30px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:220px;position:relative;transition:border-color .15s}
.big:hover{border-color:var(--ink)}
.big .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.big .ico svg{width:26px;height:26px}
.big b{font-family:var(--f-serif);font-size:30px;font-weight:700;color:var(--ink)}
.big .badge{position:absolute;top:24px;right:24px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;background:var(--terra);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px}
.tbtn{min-height:58px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:17px;padding:0 28px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.tbtn.primary{background:var(--ink);color:var(--bg)}
.tbtn.ghost{border-color:var(--line-strong)}
.tbtn.warnb{border-color:var(--mustard);color:var(--mustard)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.back{border:0;background:transparent;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);padding:4px 0;align-self:flex-start}
.env-card{display:flex;align-items:center;gap:18px;border:1px solid var(--line-strong);border-radius:22px;padding:18px 22px;background:var(--bg);text-align:left;width:100%;flex-wrap:wrap}
.env-card b{font-family:var(--f-serif);font-size:22px;color:var(--ink)}
.env-card .ico{background:var(--mustard-soft)!important;color:var(--mustard)!important;border-radius:50%!important}
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
@media (max-width:760px){.scan-grid{grid-template-columns:1fr}}
.cam{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:22px;background:#16241A;overflow:hidden;display:grid;place-items:center;color:#E8DFC9}
.cam .frame{width:70%;height:42%;border:2px solid rgba(247,239,223,.85);border-radius:12px;position:relative}
.cam .laser{position:absolute;left:4%;right:4%;height:2px;background:var(--terra);box-shadow:0 0 10px var(--terra);top:50%;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion:reduce){.cam .laser{animation:none}}
.cam .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:14px}
.counter{font-family:var(--f-cond);font-weight:500;font-size:52px;line-height:1;color:var(--ink)}
.scanned{display:flex;flex-direction:column;max-height:330px;overflow:auto;border-top:1px solid var(--line)}
.scanned div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.scanned .dmg b{color:var(--mustard)}
.scanned button{margin-left:auto;border:0;background:transparent;color:var(--mustard);font-weight:600;font-size:13px}
.flash{padding:6px 0 6px 14px;border-left:3px solid currentColor;font-weight:600;font-size:17px}
.cd-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:22px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cd-row .prod b{font-size:16.5px;font-weight:600;color:var(--ink)}
.cd-row .lab{font-family:var(--f-cond);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;text-align:center}
.cd-row.done .thumb{background:var(--ink);color:var(--bg)}
.t-step button{width:52px;height:52px;font-size:24px}
.t-step input{width:68px;font-size:20px}
@media (max-width:640px){.cd-row{grid-template-columns:1fr 1fr}.cd-row .prod{grid-column:1/-1}}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ink)}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);padding:16px 0 4px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}

/* modal PIN */
.overlay{position:fixed;inset:0;background:rgba(29,58,39,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border-radius:26px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.users{display:flex;flex-direction:column;gap:6px}
.users button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:10px 18px;text-align:left;font-weight:500}
.users button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:999px;border:0;background:var(--sunk);font-family:var(--f-cond);font-size:22px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px -14px rgba(40,30,10,.45)}
.hint{font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:0}
</style>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- datos base: productos del cuadro RETAIL; los costos son de EJEMPLO, no los reales ---------- */
const SUC=['Merliot','TOG','Soho','Cascadas','Tigo','Emblema','Kinetika'];
const CATS={beb:['Bebidas',12],boq:['Boquitas y dulces',10],bim:['Bimbo y galletas',10],pos:['Postres y pan salado',6],var:['Varios',10]};
const RAW={
 beb:[['Agua',1.65],['AMP',0.75],['Dr Juice',2.15],['Gatorade variedad',1.25],['Néctar Petit',0.35],['Kolashanpan',1.75],['Mukki',0.85],['Té Lipton variedad',2.25],['Salutaris',1.35],['Sodas variedad',0.45],['Squiz',1.85],['Yogurt Vitalité',0.95],['Yogurt vaso griego',2.35],['Yogurt líquido',1.45],['Yogurt proteína',0.55],['Be Light',1.95],['Maqui',1.05],['Yogurt chía',null],['Cocoa caliente',null],['Electrolite',null],["Welch's",null],['Vaso de avena',null]],
 boq:[['Tostadas plátano',2.45],['Tostadas yuca',1.55],['Tostadas papa',0.65],['Tostada chicharra',2.05],['Semillas mixtas',1.15],['Takis',0.25],['Papas chips',1.65],['Popcorn',0.75],['Pringles',2.15],['Chocolate nuggets',1.25],["Barra Hershey's",0.35],['La Michoacana',1.75]],
 bim:[['Bimbolete',0.85],['Donitas Bimbo',2.25],['Galleta Price',null],['Galleta Florentina',1.35],['Galletas multigrano',0.45],['Galleta Oreo',1.85],['Galletas Príncipe',0.95],['Galletas Sponch',2.35],['Hojaldritas',1.45],['Pingüinito',0.55],['Pingüino minix',1.95],['Roll de canela',1.05],['Submarinos',2.45],['Nature Valley',1.55],['Panquecito',0.65],['Canelita',2.05],['Alemana',1.15]],
 pos:[['Flan de queso',0.25],['Cheesecake',1.65],['Flautas / Delaware',null],['Tartaleta',0.75],['Tres leches',2.15],['Budín',1.25],['Pan quesadilla',0.35],['Pan alfajor',1.75],['Pan brownie',0.85],['Pan menudo',2.25],['Muffin Price',null],['Choco vainilla',null],['María Luisa',null],['Poleada',1.35],['Muffin choco',0.45]],
 var:[['Bananos',1.85],['Sushi',0.95],['Manzana',null]]
};
const PACK_OVERRIDE={'Pan menudo':25,'Sushi':4,'Bananos':20};
const PRODUCTS=[];let n=1;
for(const c in RAW)for(const [name,cost] of RAW[c]){PRODUCTS.push({id:'p'+String(n++).padStart(2,'0'),name,cat:c,cost,pack:PACK_OVERRIDE[name]||CATS[c][1]})}
const P=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const CENTRAL_USERS=['Karla Méndez · Bodega','José Alvarado · Bodega','Ana Rivas · Supervisión'];
const SUC_USERS={Merliot:['Gabriela H.','Óscar P.'],TOG:['María L.','Kevin R.'],Soho:['Daniela C.','Luis F.'],Cascadas:['Andrea M.','Carlos V.'],Tigo:['Sofía G.','Mario A.'],Emblema:['Paola R.','Jorge E.'],Kinetika:['Valeria S.','Diego N.']};
const DAYS=['L','M','M','J','V','S','D'];

/* ---------- datos de ejemplo (sembrados) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function prodCell(p,sub){return `<div class="prod">${thumb(p)}<span><b style="font-weight:600">${h(p.name)}</b>${sub?`<br><span class="muted" style="font-size:13px">${sub}</span>`:''}</span></div>`}
function stepper(key,val,cls=''){return `<span class="step ${cls}"><button data-act="dec" data-key="${key}" aria-label="Restar">−</button><input data-key="${key}" inputmode="numeric" value="${val??''}" placeholder="0" aria-label="Cantidad"><button data-act="inc" data-key="${key}" aria-label="Sumar">+</button></span>`}

function setKey(k,v){const a=k.split('.');const last=a.pop();const o=a.reduce((o,x)=>o[x],S);o[last]=v}

/* ---------- acciones con registro ---------- */
function applyRec(p){const e=S.envios.find(x=>x.id===p.envio);let miss=0;
 e.codes.forEach(c=>{const pk=S.packages.find(x=>x.code===c);if(p.scanned.includes(c))pk.status=p.damaged.includes(c)?'dañado':'recibido';else{pk.status='faltante';miss++}});
 e.status=miss||p.damaged.length?'con_diferencia':'recibido';e.faltan=miss||0;e.recibidoPor=p.user;e.recibidoAt=p.at;
 S.log.unshift({t:p.at,txt:`${h(p.user)} recibió <b>${e.id}</b> en ${e.suc}${miss?` · <b class="neg">${miss} paquete(s) no llegaron</b>`:' completo'}${p.damaged.length?` · ${p.damaged.length} dañado(s)`:''}`,bad:!!(miss||p.damaged.length)})}
function applyCd(p){S.branch[p.suc].cierre={user:p.user,t:p.at};S.log.unshift({t:p.at,txt:`${h(p.user)} cerró el día en <b>${p.suc}</b> · cinta $${(+p.cinta||0).toFixed(2)}`})}
function commit(type,payload){if(S.online){(type==='rec'?applyRec:applyCd)(payload);S.branch[S.suc].sync=0;return true}S.queue.push({type,payload});return false}
const nowT=()=>{const d=new Date();let hh=d.getHours(),mm=String(d.getMinutes()).padStart(2,'0');const ap=hh>=12?'pm':'am';hh=hh%12||12;return `${hh}:${mm} ${ap}`};

function openPin(title,users,onOk){S.modal={title,users,user:users[0],pin:'',onOk};renderModal()}
function renderModal(){const m=S.modal;const el=document.getElementById('modal');if(!m){el.innerHTML='';return}
 el.innerHTML=`<div class="overlay" data-act="pinCancelBg"><div class="modal" role="dialog" aria-modal="true" aria-label="${h(m.title)}"><h2>${h(m.title)}</h2><div class="field"><label>¿Quién es?</label><div class="users">${m.users.map(u=>`<button data-act="pinUser" data-v="${h(u)}" aria-pressed="${m.user===u}">${h(u)}</button>`).join('')}</div></div>
 <div class="field"><label style="text-align:center">PIN de 4 dígitos (prototipo: cualquiera)</label><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<m.pin.length?'on':''}"></i>`).join('')}</div></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-act="pin" data-v="${d}">${d}</button>`).join('')}<button data-act="pinCancel" style="font-size:15px">Cancelar</button><button data-act="pin" data-v="0">0</button><button data-act="pinDel" style="font-size:15px">Borrar</button></div></div></div>`}

 document.getElementById('app').innerHTML=`<header class="top"><div class="top-in"><span class="brand"><img src="https://grtomatoes.com/assets/img/logo/logo-verde.png" alt="Green &amp; Red Tomatoes" onerror="this.outerHTML='<span class=wordmark>Green &amp; Red Tomatoes</span>'"><span class="sep"></span><span class="app">Operación</span></span><span class="proto">Prototipo</span>
 <div class="seg" role="group" aria-label="Vista"><button data-act="mode" data-v="office" aria-pressed="${S.mode==='office'}">Oficina central</button><button data-act="mode" data-v="tablet" aria-pressed="${S.mode==='tablet'}">Tablet de sucursal</button></div></div></header>

 if(window.JsBarcode)document.querySelectorAll('svg[data-code]').forEach(s=>{try{JsBarcode(s,s.dataset.code,{format:'CODE128',displayValue:false,margin:0,height:60,width:2,background:'#ffffff',lineColor:'#111111'})}catch(e){}});
 renderModal();

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='pinCancelBg'&&ev.target!==b)return;
 switch(a){
 case 'mode':S.mode=v;break;
 case 'view':S.view=v;break;
 case 'inc':case 'dec':{const k=b.dataset.key;let x=+(getKey(k)||0)+(a==='inc'?1:-1);if(x<0)x=0;setKey(k,String(x));const inp=b.parentNode.querySelector('input');inp.value=x;after(k);return}
 case 'ingcat':S.ing.cat=v;break;
 case 'closeIng':openPin('Cerrar ingreso de '+S.ing.prov,CENTRAL_USERS,user=>{let units=0,prods=0;for(const pid in S.ing.qty){const q=+S.ing.qty[pid]||0;if(q){S.stock[pid]+=q;units+=q;prods++}}
   const at=nowT();S.ingresos.unshift({fecha:'13 nov '+at,prov:S.ing.prov,prods,units,by:user.split(' · ')[0]});S.log.unshift({t:at,txt:`${h(user.split(' · ')[0])} cerró ingreso de <b>${h(S.ing.prov)}</b> · ${prods} productos, ${units} u`});S.ing.qty={};toast(`Ingreso cerrado por ${h(user.split(' · ')[0])}. Bodega actualizada.`)});return;
 case 'genPk':{const need=S.pk.n*S.pk.per;S.stock[S.pk.pid]-=need;S.lastBatch=makePkgs(S.pk.pid,+S.pk.n,'bodega');S.log.unshift({t:nowT(),txt:`Se armaron ${S.pk.n} paquetes de <b>${h(P[S.pk.pid].name)}</b>`});toast(`${S.pk.n} etiquetas listas para imprimir`);break}
 case 'envsuc':S.env.suc=v;break;
 case 'envAdd':{const pk=S.packages.find(x=>x.status==='bodega'&&x.pid===v&&!S.env.codes.includes(x.code));if(pk)S.env.codes.push(pk.code);break}
 case 'envDel':{const i=S.env.codes.map(c=>S.packages.find(x=>x.code===c).pid).lastIndexOf(v);if(i>=0)S.env.codes.splice(i,1);break}
 case 'envScan':{const c=(S.env.scan||'').trim().toUpperCase();const pk=S.packages.find(x=>x.code===c);S.env.scan='';
   if(!pk)toast('Ese código no existe.');else if(pk.status!=='bodega')toast('Ese paquete ya salió en otro envío.');else if(S.env.codes.includes(c))toast('Ese paquete ya está en este envío.');else S.env.codes.push(c);break}
 case 'despachar':openPin('Despachar a '+S.env.suc,CENTRAL_USERS,user=>{const id='ENV-'+String(++envSeq).padStart(4,'0');const at=nowT();S.env.codes.forEach(c=>{const pk=S.packages.find(x=>x.code===c);pk.status='en_camino';pk.envio=id;pk.suc=S.env.suc});
   S.envios.unshift({id,suc:S.env.suc,fecha:'13 nov '+at,codes:[...S.env.codes],status:'en_camino',by:user});S.log.unshift({t:at,txt:`${h(user.split(' · ')[0])} despachó <b>${id}</b> a ${S.env.suc} · ${S.env.codes.length} paquetes`});toast(`${id} en camino a ${S.env.suc}. Ya aparece en su tablet.`);S.env.codes=[]});return;
 case 'wsuc':S.wsuc=v;break;
 case 'tsuc':S.suc=v;S.tview='home';S.scan=null;S.cd=null;break;
 case 'tview':S.tview=v;if(v==='cierre'&&!S.cd)S.cd={vend:{},quedan:{},cinta:'',cat:'beb'};break;
 case 'net':S.online=!S.online;S.branch[S.suc].online=S.online;if(S.online){const n=S.queue.length;S.queue.forEach(q=>(q.type==='rec'?applyRec:applyCd)(q.payload));S.queue=[];S.branch[S.suc].sync=0;if(n)toast(`Volvió el internet: ${n} registro(s) enviados a oficina central`)}else{S.branch[S.suc].sync=1;toast('Sin internet. La tablet sigue funcionando y guarda todo.')}break;
 case 'startScan':S.scan={envio:v,scanned:[],damaged:[],msg:null};S.tview='scan';break;
 case 'simScan':{const e=S.envios.find(x=>x.id===S.scan.envio);const next=e.codes.slice(0,-1).find(c=>!S.scan.scanned.includes(c))||e.codes.find(c=>!S.scan.scanned.includes(c));
   // deja el último paquete sin escanear hasta que se toque de nuevo, para poder probar el faltante
   if(!next){S.scan.msg={k:'warn',t:'Ya escaneó todo lo que trae este envío.'}}else{doScan(next)}break}
 case 'simWrong':{const other=S.packages.find(x=>x.status!=='bodega'&&x.suc&&x.suc!==S.suc)||S.packages.find(x=>x.status==='bodega');doScan(other.code);break}
 case 'manScan':doScan((document.getElementById('mancode').value||'').trim().toUpperCase());break;
 case 'dmg':{const i=S.scan.damaged.indexOf(v);i>=0?S.scan.damaged.splice(i,1):S.scan.damaged.push(v);break}
 case 'finishScan':S.scan.confirm=true;break;
 case 'scanBack':S.scan.confirm=false;break;
 case 'approveRec':openPin('Aprobar recepción',SUC_USERS[S.suc],user=>{const sent=commit('rec',{envio:S.scan.envio,scanned:[...S.scan.scanned],damaged:[...S.scan.damaged],user,at:nowT()});if(!sent){const e=S.envios.find(x=>x.id===S.scan.envio);e.localDone=true}
   toast(sent?'Recepción aprobada. Oficina central ya la ve.':'Guardado en la tablet. Se enviará cuando vuelva el internet.');S.scan=null;S.tview='home'});return;
 case 'cdcat':S.cd.cat=v;break;
 case 'cdFill':PRODUCTS.forEach(p=>{if(S.cd.vend[p.id]===undefined||S.cd.vend[p.id]==='')S.cd.vend[p.id]=String(ri(0,6));if(S.cd.quedan[p.id]===undefined||S.cd.quedan[p.id]==='')S.cd.quedan[p.id]=String(ri(0,15))});if(!S.cd.cinta)S.cd.cinta='184.35';break;
 case 'cdConfirm':S.cd.confirm=true;break;
 case 'cdBack':S.cd.confirm=false;break;
 case 'approveCd':openPin('Cerrar el día en '+S.suc,SUC_USERS[S.suc],user=>{const sent=commit('cd',{suc:S.suc,user,at:nowT(),cinta:S.cd.cinta});if(!sent)S.branch[S.suc].cierreLocal=true;
   if(sent)null;else S.branch[S.suc].cierre=null;toast(sent?'Día cerrado. Oficina central ya lo ve.':'Cierre guardado en la tablet. Se enviará cuando vuelva el internet.');S.cd=null;S.tview='home'});return;
 case 'pin':S.modal.pin+=v;if(S.modal.pin.length>=4){const m=S.modal;S.modal=null;m.onOk(m.user);render();return}renderModal();return;
 case 'pinDel':S.modal.pin=S.modal.pin.slice(0,-1);renderModal();return;
 case 'pinUser':S.modal.user=v;renderModal();return;
 case 'pinCancel':case 'pinCancelBg':S.modal=null;renderModal();return;
 }
 render();
});
function doScan(code){const sc=S.scan;const e=S.envios.find(x=>x.id===sc.envio);const pk=S.packages.find(x=>x.code===code);
 if(!pk)sc.msg={k:'bad',t:`El código ${h(code||'(vacío)')} no existe. Revise la etiqueta.`};
 else if(sc.scanned.includes(code))sc.msg={k:'warn',t:'Este paquete ya fue escaneado.'};
 else if(!e.codes.includes(code))sc.msg={k:'bad',t:`Este paquete no es de este envío${pk.suc&&pk.suc!==S.suc?` (va para <b>${pk.suc}</b>)`:''}. No lo reciba y avise a oficina central.`};
 else{sc.scanned.push(code);sc.msg={k:'ok',t:`✓ ${h(P[pk.pid].name)} · ${pk.units} unidades`}}}

function after(k){
 if(k.startsWith('cd.quedan')){const done=PRODUCTS.filter(p=>S.cd.quedan[p.id]!==undefined&&S.cd.quedan[p.id]!=='').length;const pr=document.getElementById('cdprog');if(pr)pr.textContent=`${done} de ${PRODUCTS.length}`;const bar=document.getElementById('cdbar');if(bar)bar.style.width=done/PRODUCTS.length*100+'%';
  const row=document.querySelector(`[data-row="${k.split('.')[2]}"]`);if(row)row.classList.toggle('done',getKey(k)!=='');const go=document.getElementById('cdgo');if(go){go.disabled=done<PRODUCTS.length;go.textContent=done<PRODUCTS.length?`Faltan ${PRODUCTS.length-done} por contar`:'Revisar y cerrar'}
  document.querySelectorAll('[data-act="cdcat"]').forEach(c=>{const ps=PRODUCTS.filter(p=>p.cat===c.dataset.v);c.textContent=`${CATS[c.dataset.v][0]} · ${ps.filter(p=>S.cd.quedan[p.id]!==undefined&&S.cd.quedan[p.id]!=='').length}/${ps.length}`})}
 if(k.startsWith('ing.qty')){const tot=Object.values(S.ing.qty).reduce((a,b)=>a+(+b||0),0);const cnt=Object.values(S.ing.qty).filter(v=>+v>0).length;document.getElementById('ingtot').textContent=`${cnt} productos · ${tot} unidades`;document.getElementById('ingbtn').disabled=!tot}
 if(k==='pk.n')render();
}
document.addEventListener('input',ev=>{const k=ev.target.dataset.key;if(!k)return;let v=ev.target.value;if(ev.target.inputMode==='numeric'){v=v.replace(/\D/g,'');ev.target.value=v}setKey(k,v);if(k!=='pk.n')after(k)});
document.addEventListener('change',ev=>{const k=ev.target.dataset.key;if(!k)return;if(k==='pk.pid'){S.pk.per=P[S.pk.pid].pack;S.lastBatch=[];render()}if(k==='pk.n'){if(!(+S.pk.n>0))S.pk.n='1';render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='envscan'){ev.preventDefault();document.querySelector('[data-act="envScan"]').click()}if(ev.key==='Enter'&&ev.target.id==='mancode'){document.querySelector('[data-act="manScan"]').click()}});
render();
</script>
