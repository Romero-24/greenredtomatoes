<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green &amp; Red Operación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
/* Layout: encabezado con logo y pestañas de texto; contenido centrado (1180px como grtomatoes.com), secciones separadas por líneas finas, sin tarjetas. Tema único claro: crema de la marca. */
:root{
  color-scheme:light;
  --bg:#F7EFDF; --surface:#FBF6EC; --sunk:#EFE5D0; --kraft:#E8D4AC;
  --ink:#1D3A27; --ink-2:#2C4A34; --text:#2A2A20; --muted:#6B6650; --line:rgba(29,58,39,.14); --line-strong:rgba(29,58,39,.32);
  --terra:#C0532F; --terra-soft:#F3DCCF; --mustard:#9A6A12; --mustard-soft:#F3E3BE; --olive:#56653F; --olive-soft:#E2E5D2;
  --paper:#FFFFFF; --paper-ink:#111111;
  --f-serif:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-sans:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond:"Oswald", "Arial Narrow", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-cond);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--terra)}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand img{height:38px;width:auto;display:block}
.brand .wordmark{font-family:var(--f-serif);font-weight:700;font-size:19px}
.brand .sep{width:1px;height:26px;background:var(--line-strong)}
.brand .app{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.proto{font-family:var(--f-cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mustard);border:1px solid currentColor;padding:2px 8px;border-radius:99px}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{border:1px solid transparent;background:transparent;padding:8px 16px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* oficina */
.office{display:block}
.nav{max-width:1180px;margin:0 auto;display:flex;gap:26px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:14px 0 12px;border-bottom:2px solid transparent;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.nav .count{font-family:var(--f-cond);font-size:12px;color:var(--terra)}
.main{min-width:0;max-width:1180px;margin:0 auto;padding-block:36px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head > div{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted);max-width:62ch}
.panel{min-width:0;border-top:1px solid var(--line-strong);padding-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.kpi{padding:18px 20px 18px 0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.kpi + .kpi{padding-left:20px;border-left:1px solid var(--line)}
.kpi > span:first-child{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.kpi b{font-family:var(--f-cond);font-size:40px;font-weight:500;line-height:1.1;color:var(--ink)}
.kpi.bad b{color:var(--terra)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:48px}
.grid2b{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:1000px){.grid2,.grid2b{grid-template-columns:1fr;gap:36px}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-family:var(--f-cond);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.cat-row td{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--terra);padding-top:22px;border-bottom:1px solid var(--line-strong)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.ok{color:var(--olive)}
.warn{color:var(--mustard)}
.bad{color:var(--terra)}
.neutral{color:var(--muted)}
.neutral::before{background:transparent;border:1.5px solid currentColor}
.neg{color:var(--terra);font-weight:600}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 20px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--terra);color:var(--terra)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feed{display:flex;flex-direction:column}
.feed div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border-bottom:0}
.feed time{color:var(--muted);font-family:var(--f-cond);letter-spacing:.04em;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{border-left:2px solid var(--line-strong);padding:4px 0 4px 12px;font-size:13.5px;color:var(--muted)}
.err{border-left:2px solid var(--terra);padding:4px 0 4px 12px;color:var(--terra);font-size:13.5px;font-weight:600}

.step{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:transparent;width:38px;height:38px;font-size:19px;color:var(--ink)}
.step button:hover{background:var(--sunk)}
.step input{border:0;border-radius:0;width:54px;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums;font-weight:600;background:transparent}
.thumb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-cond);font-weight:500;font-size:13px;letter-spacing:.04em;flex:none;background:var(--sunk);color:var(--ink)}
.c-beb,.c-boq,.c-bim,.c-pos,.c-var{background:var(--sunk);color:var(--ink)}
.prod{display:flex;align-items:center;gap:12px;min-width:0}
.prod span{min-width:0}

/* etiquetas físicas (siempre blanco y negro) */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.label{background:var(--paper);color:var(--paper-ink);border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-family:var(--f-sans)}
.label .lt{display:flex;justify-content:space-between;font-family:var(--f-cond);font-size:11px;letter-spacing:.1em}
.label .ln{font-family:var(--f-serif);font-weight:700;font-size:17px;line-height:1.2}
.label .lu{font-size:12.5px}
.label svg{width:100%;height:64px}
.label .lc{font-family:var(--f-mono);font-size:12px;text-align:center}

/* tablet */
.tab-stage{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.device{width:100%;max-width:1080px;background:var(--surface);border:10px solid var(--ink);border-radius:34px;overflow:hidden;min-height:680px;display:flex;flex-direction:column}
@media (max-width:640px){.device{border-width:1px;border-color:var(--line-strong);border-radius:var(--r)}}
.t-top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.t-top .who{font-family:var(--f-serif);font-weight:700;font-size:24px;color:var(--ink)}
.t-top .sub{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.net{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;background:transparent;color:var(--olive)}
.net.off{border-color:var(--terra);background:var(--terra);color:#fff}
.net i{width:8px;height:8px;border-radius:50%;background:currentColor}
.t-body{flex:1;padding:30px;display:flex;flex-direction:column;gap:22px;min-width:0}
.t-body h1{font-size:32px}
@media (max-width:640px){.t-body{padding:18px}}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:640px){.big-actions{grid-template-columns:1fr}}
.big{border:1px solid var(--line-strong);background:var(--bg);border-radius:24px;padding:30px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:220px;position:relative;transition:border-color .15s}
.big:hover{border-color:var(--ink)}
.big .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.big .ico svg{width:26px;height:26px}
.big b{font-family:var(--f-serif);font-size:30px;font-weight:700;color:var(--ink)}
.big .badge{position:absolute;top:24px;right:24px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;background:var(--terra);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px}
.tbtn{min-height:58px;border-radius:999px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:17px;padding:0 28px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.tbtn.primary{background:var(--ink);color:var(--bg)}
.tbtn.ghost{border-color:var(--line-strong)}
.tbtn.warnb{border-color:var(--mustard);color:var(--mustard)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
.back{border:0;background:transparent;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);padding:4px 0;align-self:flex-start}
.env-card{display:flex;align-items:center;gap:18px;border:1px solid var(--line-strong);border-radius:22px;padding:18px 22px;background:var(--bg);text-align:left;width:100%;flex-wrap:wrap}
.env-card b{font-family:var(--f-serif);font-size:22px;color:var(--ink)}
.env-card .ico{background:var(--mustard-soft)!important;color:var(--mustard)!important;border-radius:50%!important}
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
@media (max-width:760px){.scan-grid{grid-template-columns:1fr}}
.cam{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:22px;background:#16241A;overflow:hidden;display:grid;place-items:center;color:#E8DFC9}
.cam .frame{width:70%;height:42%;border:2px solid rgba(247,239,223,.85);border-radius:12px;position:relative}
.cam .laser{position:absolute;left:4%;right:4%;height:2px;background:var(--terra);box-shadow:0 0 10px var(--terra);top:50%;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion:reduce){.cam .laser{animation:none}}
.cam .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:14px}
.counter{font-family:var(--f-cond);font-weight:500;font-size:52px;line-height:1;color:var(--ink)}
.scanned{display:flex;flex-direction:column;max-height:330px;overflow:auto;border-top:1px solid var(--line)}
.scanned div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.scanned .dmg b{color:var(--mustard)}
.scanned button{margin-left:auto;border:0;background:transparent;color:var(--mustard);font-weight:600;font-size:13px}
.flash{padding:6px 0 6px 14px;border-left:3px solid currentColor;font-weight:600;font-size:17px}
.cd-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:22px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cd-row .prod b{font-size:16.5px;font-weight:600;color:var(--ink)}
.cd-row .lab{font-family:var(--f-cond);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;text-align:center}
.cd-row.done .thumb{background:var(--ink);color:var(--bg)}
.t-step button{width:52px;height:52px;font-size:24px}
.t-step input{width:68px;font-size:20px}
@media (max-width:640px){.cd-row{grid-template-columns:1fr 1fr}.cd-row .prod{grid-column:1/-1}}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ink)}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);padding:16px 0 4px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}

/* modal PIN */
.overlay{position:fixed;inset:0;background:rgba(29,58,39,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border-radius:26px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.users{display:flex;flex-direction:column;gap:6px}
.users button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:10px 18px;text-align:left;font-weight:500}
.users button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:999px;border:0;background:var(--sunk);font-family:var(--f-cond);font-size:22px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px -14px rgba(40,30,10,.45)}
.hint{font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:0}
.small{font-size:12.5px}
.me{margin-left:auto;display:flex;align-items:center;gap:14px;text-align:right;line-height:1.25}
.me b{color:var(--ink)}
.login{display:flex;justify-content:center;padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-in{width:100%;max-width:820px;display:flex;flex-direction:column;gap:24px;align-items:center;text-align:center}
.login-in h1{font-size:40px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;width:100%}
.who-card{border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;padding:20px 22px;text-align:left;display:flex;flex-direction:column;gap:4px}
.who-card b{font-family:var(--f-serif);font-size:22px;color:var(--ink)}
.who-card span{color:var(--muted);font-size:13.5px}
.who-card em{font-style:normal;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--terra)}
.who-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.login .pad{width:260px;max-width:100%}
.days{display:flex;gap:4px}
.day{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;font-family:var(--f-cond);font-size:12px;color:var(--muted);display:grid;place-items:center;padding:0}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
th.today{color:var(--terra)}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.wk{padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wk:first-child{padding-left:0}
.wk + .wk{border-left:1px solid var(--line)}
.wk b{font-family:var(--f-serif);color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.wk .d{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--muted)}
.wk.today .d{color:var(--terra)}
@media (max-width:700px){.week-strip{grid-template-columns:repeat(4,minmax(0,1fr))}.wk:nth-child(5){border-left:0;padding-left:0}.wk:nth-child(n+5){border-top:1px solid var(--line)}}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ck input{grid-column:1/-1}
.okbad{display:flex;gap:6px}
.okbad button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--muted)}
.okbad button[data-v="ok"][aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.okbad button[data-v="mal"][aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
.edit-box{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:2px 8px}
.pos{color:var(--olive);font-weight:600}

/* ===== Dashboard: fondo blanco siempre, menú lateral, tarjetas ===== */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F3F5F1;--line:rgba(29,58,39,.11);--line-strong:rgba(29,58,39,.22);--r:12px}
body{background:#FFFFFF}
h1{font-size:28px}
h2,h3{font-family:var(--f-sans);font-weight:600;letter-spacing:0}

const ACTIVE=()=>PRODUCTS.filter(p=>p.active!==false);
const isOwner=()=>S.user&&S.user.role==='duena';
function weekDiff(s){let fu=0,su=0,fv=0,sv=0;for(const pid in S.week[s]){const r=S.week[s][pid];const d=r.contado-r.esperado,c=P[pid].cost||0;if(d<0){fu+=d;fv+=d*c}else{su+=d;sv+=d*c}}return{fu,su,fv,sv,neto:fv+sv}}
function thumb(p){return `<span class="thumb c-${p.cat}">${h(initials(p.name))}</span>`}
function prodCell(p,sub){return `<div class="prod">${thumb(p)}<span><b style="font-weight:600">${h(p.name)}</b>${sub?`<br><span class="muted" style="font-size:13px">${sub}</span>`:''}</span></div>`}
function stepper(key,val,cls=''){return `<span class="step ${cls}"><button data-act="dec" data-key="${key}" aria-label="Restar">−</button><input data-key="${key}" inputmode="numeric" value="${val??''}" placeholder="0" aria-label="Cantidad"><button data-act="inc" data-key="${key}" aria-label="Sumar">+</button></span>`}
function getKey(k){return k.split('.').reduce((o,x)=>o?.[x],S)}
function setKey(k,v){const a=k.split('.');const last=a.pop();const o=a.reduce((o,x)=>o[x],S);o[last]=v}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)}
const nowT=()=>{const d=new Date();let hh=d.getHours(),mm=String(d.getMinutes()).padStart(2,'0');const ap=hh>=12?'pm':'am';hh=hh%12||12;return `${hh}:${mm} ${ap}`};
const pedidoTxt=s=>Object.entries(S.plan[s].items).filter(([,q])=>+q>0).map(([pid,q])=>`${h(P[pid].name)} <span class="muted">×${q}</span>`).join(' · ')||'<span class="muted">Sin productos</span>';
function pickFor(s){const picked=[],missing=[];for(const [pid,q] of Object.entries(S.plan[s].items)){const need=+q||0;if(!need)continue;const av=S.packages.filter(p=>p.status==='bodega'&&p.pid===pid).slice(0,need);picked.push(...av.map(p=>p.code));if(av.length<need)missing.push([pid,need-av.length])}return{picked,missing}}
function lastVisit(s){return S.visits.filter(v=>v.suc===s).sort((a,b)=>a.ago-b.ago)[0]}
const visitOk=v=>v.results.filter(r=>r.ok).length;
const icon={
 box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
 scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11h6M9 15h4"/><rect x="5" y="3" width="14" height="18" rx="2"/></svg>'
};
const ST={en_camino:'<span class="pill warn">En camino</span>',entregado:'<span class="pill warn">Entregado, sin escanear</span>',recibido:'<span class="pill ok">Recibido completo</span>',con_diferencia:'<span class="pill bad">Recibido con faltante</span>'};

/* ---------- ENTRADA ---------- */
function vLogin(){const L=S.login;const t=TEAM.find(x=>x.id===L.who);
 return `<div class="login"><div class="login-in"><span class="eyebrow">Operación · Viernes 13 de noviembre</span><h1>¿Quién entra?</h1>
 <div class="who-grid">${TEAM.map(x=>`<button class="who-card" data-act="lwho" data-v="${x.id}" aria-pressed="${L.who===x.id}"><em>${x.role==='duena'?'Ve todo':'Operaciones'}</em><b>${x.name}</b><span>${x.desc}</span></button>`).join('')}
 <button class="who-card" data-act="lwho" data-v="sucursal" aria-pressed="${L.who==='sucursal'}"><em>Tablet</em><b>Sucursal</b><span>Recibir envíos y hacer el cierre del día.</span></button></div>
 ${L.who==='sucursal'?`<div class="stack" style="align-items:center"><span class="field"><label>¿Qué sucursal es esta tablet?</label></span><div class="chips" style="justify-content:center">${SUC.map(s=>`<button class="chip" data-act="lsuc" data-v="${s}" aria-pressed="${L.suc===s}">${s}</button>`).join('')}</div><button class="btn primary" data-act="lgoSuc">Abrir tablet de ${L.suc}</button></div>`:''}
 ${t?`<div class="stack" style="align-items:center"><span class="field"><label>PIN de ${h(t.name)}</label></span><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<L.pin.length?'on':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-act="lpin" data-v="${d}">${d}</button>`).join('')}<span></span><button data-act="lpin" data-v="0">0</button><button data-act="lpinDel" style="font-size:14px">Borrar</button></div></div>`:''}
 <p class="hint">Prototipo: cualquier PIN de 4 dígitos funciona. Ricardo, Rebeca y Chris tienen el mismo acceso de Operaciones para poder cubrirse entre sí; la app registra quién hizo cada cosa.</p></div></div>`}

/* ---------- OFICINA ---------- */
function vResumen(){
 const hoy=SUC.filter(s=>S.plan[s].days.includes(TODAY));
 const entregados=hoy.filter(s=>{const e=S.envios.find(x=>x.id===S.todayEnv[s]);return e&&e.status!=='en_camino'}).length;
 const bodega=S.packages.filter(p=>p.status==='bodega').length;
 const cierresN=SUC.filter(s=>S.branch[s].cierre).length;
 const tot=SUC.reduce((a,s)=>{const w=weekDiff(s);a.f+=w.fv;a.s+=w.sv;return a},{f:0,s:0});
 const rows=SUC.map(s=>{const b=S.branch[s];const w=weekDiff(s);const lv=lastVisit(s);
  const net=b.online?(b.sync<=15?`<span class="pill ok">Hace ${b.sync} min</span>`:`<span class="pill warn">Hace ${b.sync} min</span>`):`<span class="pill bad">Sin internet · ${Math.max(1,Math.round(b.sync/60))} h</span>`;
  const q=s===S.suc&&S.queue.length?` <span class="pill warn">${S.queue.length} en espera</span>`:'';
  const c=b.cierre?`<span class="pill ok">${h(b.cierre.user)} · ${b.cierre.t}</span>`:`<span class="pill neutral">Pendiente</span>`;
  const e=S.envios.find(x=>x.id===S.todayEnv[s]);const env=S.plan[s].days.includes(TODAY)?(e?ST[e.status]:'<span class="pill neutral">Por despachar</span>'):'<span class="muted">No toca hoy</span>';
  const vis=lv?`${lv.ago===0?'Hoy':lv.ago===1?'Ayer':'Hace '+lv.ago+' días'} <span class="muted small">· ${visitOk(lv)}/${lv.results.length}</span>`:'<span class="muted">—</span>';
  return `<tr><td><b>${s}</b></td><td>${net}${q}</td><td>${c}</td><td>${env}</td><td>${vis}</td><td class="r ${w.neto<-5?'neg':w.neto>0?'pos':''}">${moneyS(w.neto)}</td></tr>`}).join('');
 return `<div class="head"><div><span class="eyebrow">Viernes 13 de noviembre</span><h1>Resumen de operación</h1><p>Estado de las 7 sucursales, la distribución de hoy, las visitas de supervisión y las diferencias de inventario.</p></div></div>
 <div class="kpis">
  <div class="kpi"><span class="muted">Distribución de hoy</span><b class="num">${entregados} / ${hoy.length}</b><span class="muted">sucursales entregadas</span></div>
  <div class="kpi"><span class="muted">Paquetes en bodega</span><b class="num">${bodega}</b><span class="muted">con etiqueta impresa</span></div>
  <div class="kpi"><span class="muted">Cierres de hoy</span><b class="num">${cierresN} / 7</b><span class="muted">${SUC.filter(s=>!S.branch[s].cierre).join(', ')||'Todas cerraron'}</span></div>
  <div class="kpi ${tot.f+tot.s<0?'bad':''}"><span class="muted">Neto semana pasada</span><b class="num">${moneyS(tot.f+tot.s)}</b><span class="muted">faltante ${money(tot.f)} · sobrante ${moneyS(tot.s)}</span></div>
 </div>
 <div class="grid-res">
  <section class="panel"><div class="panel-h"><h2>Sucursales</h2></div><div class="tbl-wrap"><table><thead><tr><th>Sucursal</th><th>Tablet</th><th>Cierre de hoy</th><th>Envío de hoy</th><th>Última visita</th><th class="r">Neto semana</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="panel"><div class="panel-h"><h2>Actividad reciente</h2></div><div class="feed">${S.log.slice(0,10).map(l=>`<div><time>${l.t}</time><span${l.bad?' style="color:var(--terra)"':''}>${l.txt}</span></div>`).join('')}</div></section>
 </div>`;
}

function vIngreso(){
 const list=ACTIVE().filter(p=>p.cat===S.ing.cat);
 const tot=Object.values(S.ing.qty).reduce((a,b)=>a+(+b||0),0);
 const cnt=Object.values(S.ing.qty).filter(v=>+v>0).length;
 return `<div class="head"><div><span class="eyebrow">Bodega central · Inventario</span><h1>Ingreso de proveedor</h1><p>Cuente lo que llegó y anótelo. Al cerrar, queda registrado quién lo contó y a qué hora, y el inventario de bodega se actualiza.</p></div></div>
 <section class="panel stack">
  <div class="row"><div class="field" style="min-width:260px"><label for="prov">Proveedor</label><select id="prov" data-key="ing.prov">${['Distribuidora La Central','Bimbo','Lácteos del Valle','Snacks Centroamérica','Panadería Doña Tere'].map(x=>`<option${x===S.ing.prov?' selected':''}>${x}</option>`).join('')}</select></div>
  <div class="chips" style="margin-left:auto">${Object.entries(CATS).map(([k,v])=>`<button class="chip" data-act="ingcat" data-v="${k}" aria-pressed="${S.ing.cat===k}">${v[0]}</button>`).join('')}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="r">En bodega ahora</th><th class="r">Unidades que llegaron</th></tr></thead><tbody>
  ${list.map(p=>`<tr><td>${prodCell(p,isOwner()?(p.cost==null?'<span style="color:var(--mustard)">Sin costo registrado</span>':'Costo '+money(p.cost)):'')}</td><td class="r num">${S.stock[p.id]}</td><td class="r">${stepper('ing.qty.'+p.id,S.ing.qty[p.id])}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px"><span class="muted" id="ingtot">${cnt} productos · ${tot} unidades</span><button class="btn primary" data-act="closeIng" ${tot?'':'disabled'} id="ingbtn">Cerrar ingreso</button></div>
 </section>
 <section class="panel"><div class="panel-h"><h2>Ingresos cerrados</h2></div><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th class="r">Productos</th><th class="r">Unidades</th><th>Cerrado por</th></tr></thead><tbody>
 ${S.ingresos.map(i=>`<tr><td>${i.fecha}</td><td>${h(i.prov)}</td><td class="r">${i.prods}</td><td class="r">${i.units.toLocaleString('es')}</td><td>${h(i.by)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function labelHTML(pk){const p=P[pk.pid];return `<div class="label"><div class="lt"><span>GREEN &amp; RED TOMATOES</span><span>${pk.idx} de ${pk.of}</span></div><div class="ln">${h(p.name)}</div><div class="lu">${pk.units} unidades · ${pk.made}</div><svg data-code="${pk.code}"></svg><div class="lc">${pk.code}</div></div>`}

function vPaquetes(){
 const p=P[S.pk.pid];const need=S.pk.n*S.pk.per;
 const groups={};S.packages.filter(x=>x.status==='bodega').forEach(x=>(groups[x.pid]=groups[x.pid]||[]).push(x));
 return `<div class="head"><div><span class="eyebrow">Bodega central · Inventario</span><h1>Armar paquetes</h1><p>Cada paquete lleva un solo producto y su propia etiqueta con código de barras. La sucursal escanea cada paquete al recibirlo.</p></div></div>
 <div class="grid2b">
  <section class="panel stack">
   <h2>Nuevo lote</h2>
   <div class="field"><label for="pkp">Producto</label><select id="pkp" data-key="pk.pid">${Object.entries(CATS).map(([k,v])=>`<optgroup label="${v[0]}">${ACTIVE().filter(x=>x.cat===k).map(x=>`<option value="${x.id}"${x.id===S.pk.pid?' selected':''}>${h(x.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
   <div class="row" style="gap:22px">
    <div class="field"><label>Unidades por paquete</label><div class="row"><b class="num" style="font-size:22px;color:var(--ink)">${S.pk.per}</b><span class="muted" style="font-size:13px">fijo para ${h(p.name)}</span></div></div>
    <div class="field"><label>Cantidad de paquetes</label>${stepper('pk.n',S.pk.n)}</div>
   </div>
   <div class="note">Se usarán <b class="num">${need}</b> unidades. Sueltas en bodega: <b class="num">${S.stock[p.id]}</b>.</div>
   ${need>S.stock[p.id]?`<div class="err">No hay suficientes unidades sueltas. Registre primero el ingreso del proveedor.</div>`:''}
   <button class="btn primary" data-act="genPk" ${need>S.stock[p.id]||!S.pk.n?'disabled':''}>Generar ${S.pk.n} etiquetas</button>
  </section>
  <section class="panel stack" style="min-width:0">
   <div class="panel-h" style="margin:0"><h2>${S.lastBatch.length?'Etiquetas para imprimir':'Vista de etiqueta'}</h2>${S.lastBatch.length?`<span class="muted">Se imprimen en la impresora térmica de bodega</span>`:''}</div>
   <div class="labels">${(S.lastBatch.length?S.lastBatch:[{code:'GRT000000',pid:S.pk.pid,units:S.pk.per,idx:1,of:S.pk.n,made:'13 nov'}]).map(labelHTML).join('')}</div>
  </section>
 </div>
 <section class="panel"><div class="panel-h"><h2>Paquetes listos en bodega</h2><span class="muted">${S.packages.filter(x=>x.status==='bodega').length} paquetes</span></div><div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="r">Paquetes</th><th class="r">Unidades</th><th>Códigos</th></tr></thead><tbody>
 ${Object.entries(groups).map(([pid,arr])=>`<tr><td>${prodCell(P[pid],arr[0].units+' u por paquete')}</td><td class="r">${arr.length}</td><td class="r">${arr.length*arr[0].units}</td><td class="mono muted">${arr[0].code} … ${arr[arr.length-1].code}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay paquetes armados.</td></tr>'}
 </tbody></table></div></section>`;
}

function vDistrib(){
 const own=isOwner();const hoy=SUC.filter(s=>S.plan[s].days.includes(TODAY));
 const rows=hoy.map(s=>{const e=S.envios.find(x=>x.id===S.todayEnv[s]);let st,act='';
  if(!e){const {missing}=pickFor(s);st=missing.length?`<span class="pill bad">Faltan paquetes: ${missing.map(([p,n])=>h(P[p].name)+' ('+n+')').join(', ')}</span>`:'<span class="pill neutral">Por despachar</span>';
   act=missing.length?`<button class="btn" data-act="view" data-v="paquetes">Armar paquetes</button>`:`<button class="btn primary" data-act="dDesp" data-v="${s}">Despachar</button>`}
  else if(e.status==='en_camino'){st=`${ST.en_camino}<br><span class="muted small">Salió ${e.salio.at} · ${h(e.salio.by)}</span>`;act=`<button class="btn primary" data-act="dEntr" data-v="${e.id}">Marcar entregado</button>`}
  else if(e.status==='entregado'){st=`${ST.entregado}<br><span class="muted small">Dejado ${e.dejo.at} · ${h(e.dejo.by)}</span>`}
  else st=`${ST[e.status]}<br><span class="muted small">${h(e.recibidoPor||'')} · ${e.recibidoAt||''}</span>`;
  return `<tr><td><b>${s}</b>${e?`<br><span class="mono muted">${e.id}</span>`:''}</td><td class="small">${pedidoTxt(s)}</td><td>${st}</td><td class="r">${act}</td></tr>`}).join('');
 const planRows=SUC.map(s=>{const pl=S.plan[s];
  const days=DAYS.map((d,i)=>`<td class="r" style="padding-inline:3px">${own?`<button class="day ${pl.days.includes(i)?'on':''}" data-act="pday" data-s="${s}" data-v="${i}" aria-pressed="${pl.days.includes(i)}" aria-label="${DAYN[i]}">${d}</button>`:`<span class="day ${pl.days.includes(i)?'on':''}" style="display:inline-grid">${d}</span>`}</td>`).join('');
  const edit=S.planEdit===s?`<tr><td colspan="10"><div class="edit-box"><b style="color:var(--ink)">Pedido base de ${s}</b><span class="muted small">Paquetes que se mandan cada día que le toca.</span>
   ${Object.keys(pl.items).map(pid=>`<div class="row" style="justify-content:space-between">${prodCell(P[pid],P[pid].pack+' u por paquete')}${stepper('plan.'+s+'.items.'+pid,pl.items[pid])}</div>`).join('')}
   <div class="row"><select id="planadd" data-key="planAdd" style="flex:1;min-width:0"><option value="">+ Agregar producto…</option>${PRODUCTS.filter(p=>!(p.id in pl.items)).map(p=>`<option value="${p.id}">${h(p.name)}</option>`).join('')}</select><button class="btn primary" data-act="planDone">Listo</button></div></div></td></tr>`:'';
  return `<tr><td><b>${s}</b></td>${days}<td class="small">${pedidoTxt(s)}</td><td class="r">${own&&S.planEdit!==s?`<button class="btn" data-act="planEdit" data-v="${s}">Editar</button>`:''}</td></tr>${edit}`}).join('');
 return `<div class="head"><div><span class="eyebrow">Viernes 13 de noviembre</span><h1>Distribución</h1><p>La dueña define qué días le toca a cada sucursal y qué se le manda. Quien distribuye despacha y marca la entrega; la sucursal confirma escaneando.</p></div></div>
 <section class="panel"><div class="panel-h"><h2>Hoy · ${DAYN[TODAY]}</h2><span class="muted">${hoy.length} sucursales</span></div><div class="tbl-wrap"><table><thead><tr><th>Sucursal</th><th>Qué lleva (paquetes)</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <section class="panel"><div class="panel-h"><h2>Plan semanal</h2><span class="muted">${own?'Toque un día para activarlo o quitarlo':'Lo define la dueña'}</span></div><div class="tbl-wrap"><table><thead><tr><th>Sucursal</th>${DAYS.map((d,i)=>`<th class="r ${i===TODAY?'today':''}" style="padding-inline:3px">${d}</th>`).join('')}<th>Pedido base</th><th></th></tr></thead><tbody>${planRows}</tbody></table></div></section>`;
}

function vEnvios(){

 <section class="panel"><div class="panel-h"><h2>Historial</h2></div><div class="tbl-wrap"><table><thead><tr><th>Envío</th><th>Sucursal</th><th>Salió de bodega</th><th>Lo dejó</th><th class="r">Paquetes</th><th>Estado</th><th>Recibió</th></tr></thead><tbody>
 ${S.envios.map(e=>`<tr><td class="mono">${e.id}</td><td><b>${e.suc}</b></td><td>${e.fecha} ${e.salio.at}<br><span class="muted small">${h(e.salio.by)}</span></td><td>${e.dejo?`${e.dejo.at}<br><span class="muted small">${h(e.dejo.by)}</span>`:'<span class="muted">—</span>'}</td><td class="r">${e.codes.length}${e.faltan?` <span class="neg">(${e.faltan} no llegó)</span>`:''}</td><td>${ST[e.status]}</td><td>${e.recibidoPor?h(e.recibidoPor)+(e.recibidoAt?'<br><span class="muted small">'+e.recibidoAt+'</span>':''):'<span class="muted">—</span>'}</td></tr>`).join('')}
 </tbody></table></div></section>
 <div class="grid2b">
  <section class="panel stack">
   <h2>Envío extra</h2>
   <div class="field"><label>Sucursal destino</label><div class="chips">${SUC.map(s=>`<button class="chip" data-act="envsuc" data-v="${s}" aria-pressed="${S.env.suc===s}">${s}</button>`).join('')}</div></div>
   <div class="field"><label for="envscan">Escanear etiqueta</label><div class="row"><input id="envscan" data-key="env.scan" class="mono" placeholder="GRT001234" style="flex:1;min-width:0" value="${h(S.env.scan)}"><button class="btn" data-act="envScan">Agregar</button></div></div>
   <div>${Object.keys(inDraft).length?`<table><tbody>${Object.entries(inDraft).map(([pid,c])=>`<tr><td>${prodCell(P[pid])}</td><td class="r num"><b>${c}</b> paq · ${c*P[pid].pack} u</td><td class="r"><button class="x" data-act="envDel" data-v="${pid}" aria-label="Quitar uno">×</button></td></tr>`).join('')}</tbody></table>`:'<div class="note">Todavía no hay paquetes en este envío.</div>'}</div>
   <button class="btn primary" data-act="despachar" ${S.env.codes.length?'':'disabled'}>Despachar a ${S.env.suc} · ${S.env.codes.length} paquetes</button>
  </section>
  <section class="panel" style="min-width:0"><div class="panel-h"><h2>Disponibles en bodega</h2><span class="muted">Toque para agregar un paquete</span></div><div class="tbl-wrap"><table><tbody>
   ${Object.entries(avail).map(([pid,arr])=>`<tr><td>${prodCell(P[pid],arr[0].units+' u por paquete')}</td><td class="r num">${arr.length} disponibles</td><td class="r"><button class="btn" data-act="envAdd" data-v="${pid}">+ 1</button></td></tr>`).join('')||'<tr><td class="muted">No hay paquetes disponibles. Ármelos en "Armar paquetes".</td></tr>'}
  </tbody></table></div></section>
 </div>`;
}

function vSuper(){
 const own=isOwner();const todayV=S.visits.find(v=>v.ago===0);
 const strip=DAYS.map((d,i)=>{const v=S.visits.find(x=>x.ago===TODAY-i);return `<div class="wk ${i===TODAY?'today':''}"><span class="d">${DAYN[i].slice(0,3)}${i===TODAY?' · hoy':''}</span><b>${v?v.suc:(i<TODAY?'Sin visita':i===TODAY?'Pendiente':'—')}</b>${v?`<span class="pill ${visitOk(v)<v.results.length?'warn':'ok'}">${visitOk(v)} de ${v.results.length} bien</span>`:''}</div>`}).join('');
 let today;
 if(S.visit){const V=S.visit;const answered=S.checklist.every((_,i)=>V.res[i]);const counted=V.conteo.every(pid=>V.counts[pid]!==undefined&&V.counts[pid]!=='');
  today=`<div class="stack"><div class="panel-h" style="margin:0"><h2>Visita a ${V.suc}</h2><button class="btn" data-act="vCancel">Cancelar</button></div>
  <div>${S.checklist.map((item,i)=>`<div class="ck"><span>${h(item)}</span><div class="okbad"><button data-act="ck" data-i="${i}" data-v="ok" aria-pressed="${V.res[i]==='ok'}">Bien</button><button data-act="ck" data-i="${i}" data-v="mal" aria-pressed="${V.res[i]==='mal'}">Hay problema</button></div>${V.res[i]==='mal'?`<input data-key="visit.notes.${i}" value="${h(V.notes[i]||'')}" placeholder="¿Qué encontró? ¿Qué se hizo?">`:''}</div>`).join('')}</div>
  <div class="stack" style="gap:6px"><h3>Conteo sorpresa</h3><span class="muted small">Cuente estos productos en la sucursal. La diferencia contra el sistema se ve al terminar.</span>
  ${V.conteo.map(pid=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0">${prodCell(P[pid])}${stepper('visit.counts.'+pid,V.counts[pid])}</div>`).join('')}</div>
  <button class="btn primary" data-act="vFinish" ${answered&&counted?'':'disabled'}>${answered&&counted?'Terminar visita':'Responda todo el checklist y el conteo'}</button></div>`}
 else if(todayV){const difs=todayV.conteo.map(c=>c.contado-c.sistema);
  today=`<div class="stack"><h2>Hoy: ${todayV.suc}</h2><p class="muted" style="margin:0">${h(todayV.by)} terminó la visita a las ${todayV.at}. ${visitOk(todayV)} de ${todayV.results.length} puntos bien.</p>
  ${todayV.results.filter(r=>!r.ok).map(r=>`<div class="err">${h(r.item)}${r.note?': '+h(r.note):''}</div>`).join('')}
  <div class="note">Conteo sorpresa: ${todayV.conteo.map((c,i)=>`${h(P[c.pid].name)} ${difs[i]===0?'cuadra':`<b class="${difs[i]<0?'neg':'pos'}">${difs[i]>0?'+':''}${difs[i]}</b>`}`).join(' · ')}</div></div>`}
 else{const sorted=SUC.slice().sort((a,b)=>(lastVisit(b)?.ago??99)-(lastVisit(a)?.ago??99));const sug=sorted[0];
  today=`<div class="stack"><h2>Visita de hoy</h2><p class="muted" style="margin:0">Se sugiere la sucursal que lleva más días sin visita.</p>
  <div class="tbl-wrap"><table><tbody>${sorted.map(s=>{const lv=lastVisit(s);return `<tr><td><b>${s}</b>${s===sug?' <span class="pill bad">Sugerida</span>':''}</td><td class="muted">${lv?`Última: ${lv.fecha} · hace ${lv.ago} días`:'Nunca'}</td><td class="r"><button class="btn ${s===sug?'primary':''}" data-act="vStart" data-v="${s}">Empezar</button></td></tr>`}).join('')}</tbody></table></div></div>`}
 const hist=S.visits.slice().sort((a,b)=>a.ago-b.ago).map(v=>{const probs=v.results.filter(r=>!r.ok);return `<tr><td>${v.fecha}</td><td><b>${v.suc}</b></td><td>${h(v.by)}</td><td><span class="pill ${probs.length?'warn':'ok'}">${visitOk(v)} de ${v.results.length}</span></td><td class="small">${probs.map(r=>h(r.note||r.item)).join('<br>')||'<span class="muted">—</span>'}</td><td class="small">${v.conteo.map(c=>{const d=c.contado-c.sistema;return `${h(P[c.pid].name)} ${d===0?'<span class="muted">cuadra</span>':`<b class="${d<0?'neg':'pos'}">${d>0?'+':''}${d}</b>`}`}).join('<br>')}</td></tr>`}).join('');
 return `<div class="head"><div><span class="eyebrow">Supervisión</span><h1>Visitas a sucursales</h1><p>Cada día se visita una sucursal: se revisa el checklist y se hace un conteo sorpresa de algunos productos.</p></div></div>
 <div class="week-strip">${strip}</div>
 <div class="grid2">
  <section class="panel">${today}</section>
  <section class="panel stack"><div class="panel-h" style="margin:0"><h2>Checklist</h2><span class="muted">${own?'Se usa en todas las sucursales':'Lo define la dueña'}</span></div>
   <div>${S.checklist.map((c,i)=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;flex-wrap:nowrap"><span>${h(c)}</span>${own&&!S.visit?`<button class="x" data-act="ckDel" data-v="${i}" aria-label="Quitar">×</button>`:''}</div>`).join('')}</div>
   ${own&&!S.visit?`<div class="row"><input id="newitem" data-key="newItem" value="${h(S.newItem)}" placeholder="Nuevo punto a revisar" style="flex:1;min-width:0"><button class="btn" data-act="ckAdd">Agregar</button></div>`:''}
  </section>
 </div>
 <section class="panel"><div class="panel-h"><h2>Historial de visitas</h2></div><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Sucursal</th><th>Supervisor</th><th>Resultado</th><th>Problemas</th><th>Conteo sorpresa</th></tr></thead><tbody>${hist}</tbody></table></div></section>`;
}

function weekRow(p,r){const ent=r.ent.reduce((a,b)=>a+b,0),cinta=r.ven.reduce((a,b)=>a+b,0),vcalc=r.ini+ent-r.contado,dif=cinta-vcalc,c=p.cost||0;return{ent,cinta,vcalc,dif,c,cEnv:ent*c,cIni:r.ini*c}}
function vSemana(){
 const w=S.week[S.wsuc];let tot={ven:0,cEnv:0,cIni:0,fv:0,sv:0,fu:0,su:0};
 PRODUCTS.forEach(p=>{const r=w[p.id];const x=weekRow(p,r);tot.ven+=x.cinta;tot.cEnv+=x.cEnv;tot.cIni+=x.cIni;const d=r.contado-r.esperado;if(d<0){tot.fv+=d*x.c;tot.fu+=d}else{tot.sv+=d*x.c;tot.su+=d}});
 const cuadro=S.wmode==='cuadro';
 return `<div class="head"><div><span class="eyebrow">Semana 45 · 2 al 8 de noviembre</span><h1>Cierre semanal</h1><p>Se arma solo con los envíos recibidos y los cierres diarios. El sobrante de un producto cubre el faltante de otro; el neto es lo que realmente falta.</p></div><button class="btn" disabled title="Disponible en la versión real">Descargar PDF</button></div>
 <div class="chips">${SUC.map(s=>{const d=weekDiff(s).neto;return `<button class="chip" data-act="wsuc" data-v="${s}" aria-pressed="${S.wsuc===s}">${s}${d<-5?` · <span style="color:${S.wsuc===s?'inherit':'var(--terra)'}">${money(d)}</span>`:''}</button>`}).join('')}</div>
 <div class="kpis">
  <div class="kpi"><span class="muted">Costo enviado</span><b class="num">${money(tot.cEnv)}</b><span class="muted">inventario inicial ${money(tot.cIni)}</span></div>
  <div class="kpi bad"><span class="muted">Faltante</span><b class="num">${money(tot.fv)}</b><span class="muted">${tot.fu} unidades</span></div>
  <div class="kpi"><span class="muted">Sobrante</span><b class="num" style="color:var(--olive)">${moneyS(tot.sv)}</b><span class="muted">+${tot.su} unidades</span></div>
  <div class="kpi ${tot.fv+tot.sv<0?'bad':''}"><span class="muted">Neto</span><b class="num">${moneyS(tot.fv+tot.sv)}</b><span class="muted">faltante menos sobrante</span></div>
 </div>
 <section class="panel"><div class="panel-h"><div class="seg2" role="group" aria-label="Vista"><button data-act="wmode" data-v="resumen" aria-pressed="${!cuadro}">Vista resumida</button><button data-act="wmode" data-v="cuadro" aria-pressed="${cuadro}">Cuadro completo</button></div><span class="muted small">${cuadro?`Mismo orden de columnas que el cuadro RETAIL de ${S.wsuc}`:'Ventas por día según la cinta'}</span></div>
 ${cuadro?semanaCuadro(w):semanaResumida(w)}</section>
 <p class="hint" style="text-align:left">${cuadro?'Venta total = inicial + entradas − inventario final contado. Diferencia = venta cinta − venta total (negativo = falta producto).':'"Debía quedar" = inicial + entró − vendido.'} Solo la dueña ve esta pantalla. Los costos de este prototipo son de ejemplo.</p>`;
}
function semanaResumida(w){
 const body=Object.entries(CATS).map(([k,v])=>`<tr class="cat-row"><td colspan="16">${v[0]}</td></tr>`+PRODUCTS.filter(p=>p.cat===k).map(p=>{const r=w[p.id];const e=r.ent.reduce((a,b)=>a+b,0),vv=r.ven.reduce((a,b)=>a+b,0),d=r.contado-r.esperado,c=p.cost||0;const cls=d<0?'neg':d>0?'pos':'';
  return `<tr><td style="white-space:nowrap">${h(p.name)}${p.cost==null?' <span class="pill warn">sin costo</span>':''}</td><td class="r">${r.ini}</td><td class="r">${e||'<span class="muted">0</span>'}</td>${r.ven.map(x=>`<td class="r muted">${x}</td>`).join('')}<td class="r"><b>${vv}</b></td><td class="r">${r.esperado}</td><td class="r">${r.contado}</td><td class="r ${cls}">${d?(d>0?'+':'')+d:'<span class="muted">0</span>'}</td><td class="r ${cls}">${d?moneyS(d*c):'<span class="muted">—</span>'}</td></tr>`}).join('')).join('');
 return `<div class="tbl-wrap"><table style="font-size:14px"><thead><tr><th>Producto</th><th class="r">Inicial</th><th class="r">Entró</th>${DAYS.map(d=>`<th class="r">${d}</th>`).join('')}<th class="r">Vendido</th><th class="r">Debía quedar</th><th class="r">Contaron</th><th class="r">Dif.</th><th class="r">Dif. $</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function semanaCuadro(w){
 const z=v=>v?v:'<span class="muted">0</span>';
 const moneyZ=v=>v?money(v):'<span class="muted">—</span>';
 let G={ent:0,vcalc:0,cinta:0,dif:0,cEnv:0,cIni:0};
 const body=Object.entries(CATS).map(([k,v])=>{let T={ent:0,vcalc:0,cinta:0,dif:0,cEnv:0,cIni:0};
  const rows=PRODUCTS.filter(p=>p.cat===k).map(p=>{const r=w[p.id];const x=weekRow(p,r);for(const f in T){T[f]+=x[f];G[f]+=x[f]}
   let prev=r.ini;const days=r.ent.map((e,d)=>{const ini=prev,ve=r.ven[d],rest=ini+e-ve;prev=rest;return `<td class="d0">${ini}</td><td>${z(e)}</td><td>${z(ve)}</td><td class="muted">${rest}</td>`}).join('');
   const cls=x.dif<0?'neg':x.dif>0?'pos':'';
   return `<tr><td class="stick">${h(p.name)}</td><td class="d0">${r.ini}</td><td><span class="muted">0</span></td>${days}<td class="d0"><b>${r.contado}</b></td><td>${x.ent}</td><td>${x.vcalc}</td><td>${x.cinta}</td><td class="${cls}">${x.dif?(x.dif>0?'+':'')+x.dif:'<span class="muted">0</span>'}</td><td class="d0">${p.cost==null?'<span class="pill warn">sin costo</span>':money(p.cost)}</td><td>${moneyZ(x.cEnv)}</td><td>${moneyZ(x.cIni)}</td><td><b>${moneyZ(x.cEnv+x.cIni)}</b></td></tr>`}).join('');
  return `<tr class="cat-row"><td class="stick" colspan="1">${v[0]}</td><td colspan="39"></td></tr>${rows}<tr class="sub"><td class="stick">Total ${v[0].toLowerCase()}</td><td colspan="30" class="d0"></td><td class="d0"></td><td>${T.ent}</td><td>${T.vcalc}</td><td>${T.cinta}</td><td class="${T.dif<0?'neg':''}">${T.dif}</td><td class="d0"></td><td>${money(T.cEnv)}</td><td>${money(T.cIni)}</td><td>${money(T.cEnv+T.cIni)}</td></tr>`}).join('');
 return `<div class="tbl-wrap xl"><table><thead>
 <tr><th rowspan="2" class="stick">Producto</th><th rowspan="2" class="d0">Inv. inicial</th><th rowspan="2">Faltante</th>${DAYN.map(d=>`<th colspan="4" class="dayh d0">${d}</th>`).join('')}<th rowspan="2" class="d0">Inventario final</th><th rowspan="2">Entrada total</th><th rowspan="2">Venta total</th><th rowspan="2">Venta cinta</th><th rowspan="2">Diferencia</th><th rowspan="2" class="d0">Precio de costo</th><th rowspan="2">Total costo enviado</th><th rowspan="2">Total costo inv. inicial</th><th rowspan="2">Total costo semanal</th></tr>
 <tr>${DAYN.map(()=>`<th class="d0">Inicia</th><th>Entra</th><th>Venta</th><th>Restante</th>`).join('')}</tr></thead>
 <tbody>${body}<tr class="sub grand"><td class="stick">Total semana</td><td colspan="30" class="d0"></td><td class="d0"></td><td>${G.ent}</td><td>${G.vcalc}</td><td>${G.cinta}</td><td class="${G.dif<0?'neg':''}">${G.dif}</td><td class="d0"></td><td>${money(G.cEnv)}</td><td>${money(G.cIni)}</td><td>${money(G.cEnv+G.cIni)}</td></tr></tbody></table></div>`;
}

function vProductos(){
 const f=S.pf||'todos';const sin=PRODUCTS.filter(p=>p.cost==null&&p.active!==false).length;
 const list=PRODUCTS.filter(p=>f==='todos'||(f==='sincosto'?p.cost==null:p.cat===f));
 const rows=list.map(p=>`<tr class="${p.active===false?'off':''}"><td>${prodCell(p,CATS[p.cat][0])}</td>
  <td class="r"><span class="money-in">$<input data-prod="${p.id}" data-field="cost" inputmode="decimal" value="${p.cost==null?'':p.cost.toFixed(2)}" placeholder="Sin costo" aria-label="Costo de ${h(p.name)}"></span>${p.costLog?`<br><span class="muted small">${h(p.costLog.by)} · ${p.costLog.at}${p.costLog.old!=null?' · antes '+money(p.costLog.old):''}</span>`:''}</td>
  <td class="r"><input class="pack-in" data-prod="${p.id}" data-field="pack" inputmode="numeric" value="${p.pack}" aria-label="Unidades por paquete"> <span class="muted small">u</span></td>
  <td class="r num">${S.stock[p.id]}</td>
  <td class="r"><button class="toggle" data-act="pact" data-v="${p.id}" aria-pressed="${p.active!==false}"><i></i>${p.active!==false?'Activo':'Inactivo'}</button></td></tr>`).join('');
 return `<div class="head"><div><span class="eyebrow">Catálogo</span><h1>Productos</h1><p>Productos, costos y tamaño de paquete. Reemplaza las columnas de producto y costo del Excel; cada cambio de costo queda registrado.</p></div></div>
 ${sin?`<div class="banner"><span><b>${sin} productos sin costo.</b> No suman en dinero en el cierre semanal hasta que se les ponga precio.</span><button class="btn" data-act="pf" data-v="sincosto">Ver cuáles</button></div>`:''}
 <div class="chips"><button class="chip" data-act="pf" data-v="todos" aria-pressed="${f==='todos'}">Todos · ${PRODUCTS.length}</button>${Object.entries(CATS).map(([k,v])=>`<button class="chip" data-act="pf" data-v="${k}" aria-pressed="${f===k}">${v[0]}</button>`).join('')}<button class="chip" data-act="pf" data-v="sincosto" aria-pressed="${f==='sincosto'}">Sin costo · ${PRODUCTS.filter(p=>p.cost==null).length}</button></div>
 <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="r">Costo</th><th class="r">Por paquete</th><th class="r">En bodega</th><th class="r">Estado</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">No hay productos en este filtro.</td></tr>'}</tbody></table></div></section>
 <section class="panel stack"><h2>Agregar producto</h2>
  <div class="row" style="align-items:flex-end;gap:14px">
   <div class="field" style="flex:2;min-width:200px"><label for="npn">Nombre</label><input id="npn" data-key="np.name" value="${h(S.np.name)}" placeholder="Ej. Jugo de naranja"></div>
   <div class="field" style="flex:1;min-width:160px"><label for="npc">Categoría</label><select id="npc" data-key="np.cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${S.np.cat===k?' selected':''}>${v[0]}</option>`).join('')}</select></div>
   <div class="field" style="width:120px"><label for="npco">Costo ($)</label><input id="npco" data-key="np.cost" inputmode="decimal" value="${h(S.np.cost)}" placeholder="0.00"></div>
   <div class="field" style="width:120px"><label for="npp">Por paquete</label><input id="npp" data-key="np.pack" inputmode="numeric" value="${h(S.np.pack)}" placeholder="${CATS[S.np.cat][1]}"></div>
   <button class="btn primary" data-act="padd">Agregar</button>
  </div></section>`;
}

 const rows=TEAM.map(t=>`<tr><td><b>${t.name}</b></td><td>${t.perfil}</td><td class="small">${t.role==='duena'?'Todo: resumen, costos, cierre semanal, plan de distribución, checklist y equipo.':'Ingresos, paquetes, distribución, envíos y supervisión. No ve costos ni dinero.'}</td></tr>`).join('');
 const suc=SUC.map(s=>`<tr><td><b>${SUC_USERS[s].join(', ')}</b></td><td>Tablet ${s}</td><td class="small">Recibir envíos y cierre del día. No ve el inventario esperado.</td></tr>`).join('');
 return `<div class="head"><div><span class="eyebrow">Accesos</span><h1>Equipo</h1><p>Ricardo, Rebeca y Chris comparten el perfil de Operaciones para poder cubrirse entre sí. Cada acción queda firmada con el nombre de quien la hizo.</p></div><button class="btn" disabled title="Disponible en la versión real">Agregar persona</button></div>
 <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Persona</th><th>Perfil</th><th>Qué puede hacer</th></tr></thead><tbody>${rows}${suc}</tbody></table></div></section>`;

function office(){
 const views={resumen:vResumen,ingreso:vIngreso,paquetes:vPaquetes,distribucion:vDistrib,envios:vEnvios,supervision:vSuper,semana:vSemana,productos:vProductos,equipo:vEquipo};
 const groups=NAV[S.user.role];

 return `<div><span class="eyebrow">Viernes 13 de noviembre</span><h1>¿Qué va a hacer?</h1></div>
 <div class="big-actions">
  <button class="big" data-act="tview" data-v="recibir"><span class="ico">${icon.scan}</span><b>Recibir envío</b><span class="muted" style="font-size:16px">Escanee cada paquete que llegó de oficina central.</span>${pend?`<span class="badge">${pend} por recibir</span>`:''}</button>

 return `<button class="back" data-act="tview" data-v="home">← Inicio</button><h1>Envíos por recibir</h1>

function tScan(){
 const sc=S.scan;const e=S.envios.find(x=>x.id===sc.envio);

  </div>

   <div class="scanned">${sc.scanned.slice().reverse().map(c=>{const pk=pkg(c);const d=sc.damaged.includes(c);return `<div class="${d?'dmg':''}">${thumb(P[pk.pid])}<span><b>${h(P[pk.pid].name)}</b> · ${pk.units} u<br><span class="mono muted">${c}</span></span><button data-act="dmg" data-v="${c}">${d?'Quitar daño':'Marcar dañado'}</button></div>`}).join('')||'<div class="note" style="font-size:16px;border:0">Aún no ha escaneado paquetes.</div>'}</div>

/* ---------- acciones con registro ---------- */
function applyRec(p){const e=S.envios.find(x=>x.id===p.envio);let miss=0;
 e.codes.forEach(c=>{const pk=pkg(c);if(p.scanned.includes(c))pk.status=p.damaged.includes(c)?'dañado':'recibido';else{pk.status='faltante';miss++}});
 e.status=miss||p.damaged.length?'con_diferencia':'recibido';e.faltan=miss||0;e.recibidoPor=p.user;e.recibidoAt=p.at;
 S.log.unshift({t:p.at,txt:`${h(p.user)} recibió <b>${e.id}</b> en ${e.suc}${miss?` · <b>${miss} paquete(s) no llegaron</b>`:' completo'}${p.damaged.length?` · ${p.damaged.length} dañado(s)`:''}`,bad:!!(miss||p.damaged.length)})}
function applyCd(p){S.branch[p.suc].cierre={user:p.user,t:p.at};S.log.unshift({t:p.at,txt:`${h(p.user)} cerró el día en <b>${p.suc}</b> · cinta $${(+p.cinta||0).toFixed(2)}`})}
function commit(type,payload){if(S.online){(type==='rec'?applyRec:applyCd)(payload);S.branch[S.suc].sync=0;return true}S.queue.push({type,payload});return false}
function dispatch(suc,codes,by){const id='ENV-'+String(++envSeq).padStart(4,'0');const at=nowT();codes.forEach(c=>{const pk=pkg(c);pk.status='en_camino';pk.envio=id;pk.suc=suc});
 S.envios.unshift({id,suc,fecha:'13 nov',codes:[...codes],status:'en_camino',salio:{by,at},dejo:null});S.log.unshift({t:at,txt:`${h(by)} despachó <b>${id}</b> a ${suc} · ${codes.length} paquetes`});return id}

function openPin(title,users,onOk){S.modal={title,users,user:users[0],pin:'',onOk};renderModal()}
function renderModal(){const m=S.modal;const el=document.getElementById('modal');if(!m){el.innerHTML='';return}
 el.innerHTML=`<div class="overlay" data-act="pinCancelBg"><div class="modal" role="dialog" aria-modal="true" aria-label="${h(m.title)}"><h2>${h(m.title)}</h2>${m.users.length>1?`<div class="field"><label>¿Quién es?</label><div class="users">${m.users.map(u=>`<button data-act="pinUser" data-v="${h(u)}" aria-pressed="${m.user===u}">${h(u)}</button>`).join('')}</div></div>`:`<p class="muted" style="margin:0">Firma: <b style="color:var(--ink)">${h(m.user)}</b></p>`}
 <div class="field"><label style="text-align:center">PIN de 4 dígitos (prototipo: cualquiera)</label><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<m.pin.length?'on':''}"></i>`).join('')}</div></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-act="pin" data-v="${d}">${d}</button>`).join('')}<button data-act="pinCancel" style="font-size:14px">Cancelar</button><button data-act="pin" data-v="0">0</button><button data-act="pinDel" style="font-size:14px">Borrar</button></div></div></div>`}
const me=()=>[S.user.name];

document.addEventListener('click',ev=>{

   const at=nowT();S.ingresos.unshift({fecha:'13 nov '+at,prov:S.ing.prov,prods,units,by:user});S.log.unshift({t:at,txt:`${h(user)} cerró ingreso de <b>${h(S.ing.prov)}</b> · ${prods} productos, ${units} u`});S.ing.qty={};toast(`Ingreso cerrado por ${h(user)}. Bodega actualizada.`)});return;
 case 'genPk':{const need=S.pk.n*S.pk.per;S.stock[S.pk.pid]-=need;S.lastBatch=makePkgs(S.pk.pid,+S.pk.n,'bodega');S.log.unshift({t:nowT(),txt:`${h(S.user.name)} armó ${S.pk.n} paquetes de <b>${h(P[S.pk.pid].name)}</b>`});toast(`${S.pk.n} etiquetas listas para imprimir`);break}
 case 'envsuc':S.env.suc=v;break;
 case 'envAdd':{const pk=S.packages.find(x=>x.status==='bodega'&&x.pid===v&&!S.env.codes.includes(x.code));if(pk)S.env.codes.push(pk.code);break}

   if(!pk)toast('Ese código no existe.');else if(pk.status!=='bodega')toast('Ese paquete ya salió en otro envío.');else if(S.env.codes.includes(c))toast('Ese paquete ya está en este envío.');else S.env.codes.push(c);break}
 case 'despachar':openPin('Despachar envío extra a '+S.env.suc,me(),user=>{const id=dispatch(S.env.suc,S.env.codes,user);toast(`${id} en camino a ${S.env.suc}. Ya aparece en su tablet.`);S.env.codes=[]});return;

 case 'dEntr':openPin('Entregado en sucursal',me(),user=>{const e=S.envios.find(x=>x.id===v);e.status='entregado';e.dejo={by:user,at:nowT()};S.log.unshift({t:e.dejo.at,txt:`${h(user)} entregó <b>${e.id}</b> en ${e.suc} · falta que la sucursal escanee`});toast(`Entrega registrada. ${e.suc} debe escanear los paquetes.`)});return;

 case 'planEdit':S.planEdit=v;break;

 case 'pact':{const p=P[v];p.active=p.active===false;toast(p.active?h(p.name)+' activo de nuevo':h(p.name)+' desactivado: ya no aparece en tablets ni en ingresos');break}
 case 'padd':{const N=S.np;const name=(N.name||'').trim();if(!name){toast('Escriba el nombre del producto.');return}if(PRODUCTS.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('Ya existe un producto con ese nombre.');return}
   const id='p'+String(PRODUCTS.length+1).padStart(2,'0');const cost=parseFloat(N.cost);const p={id,name,cat:N.cat,cost:isNaN(cost)?null:cost,pack:parseInt(N.pack)||CATS[N.cat][1]};PRODUCTS.push(p);P[id]=p;S.stock[id]=0;

function doScan(code){const sc=S.scan;const e=S.envios.find(x=>x.id===sc.envio);const pk=pkg(code);
 if(!pk)sc.msg={k:'bad',t:`El código ${h(code||'(vacío)')} no existe. Revise la etiqueta.`};
 else if(sc.scanned.includes(code))sc.msg={k:'warn',t:'Este paquete ya fue escaneado.'};
 else if(!e.codes.includes(code))sc.msg={k:'bad',t:`Este paquete no es de este envío${pk.suc&&pk.suc!==S.suc?` (va para <b>${pk.suc}</b>)`:''}. No lo reciba y avise a oficina central.`};
 else{sc.scanned.push(code);sc.msg={k:'ok',t:`✓ ${h(P[pk.pid].name)} · ${pk.units} unidades`}}}

function after(k){
 if(k.startsWith('cd.quedan')){const done=ACTIVE().filter(p=>S.cd.quedan[p.id]!==undefined&&S.cd.quedan[p.id]!=='').length;const pr=document.getElementById('cdprog');if(pr)pr.textContent=`${done} de ${ACTIVE().length}`;const bar=document.getElementById('cdbar');if(bar)bar.style.width=done/ACTIVE().length*100+'%';
  const row=document.querySelector(`[data-row="${k.split('.')[2]}"]`);if(row)row.classList.toggle('done',getKey(k)!=='');const go=document.getElementById('cdgo');if(go){go.disabled=done<ACTIVE().length;go.textContent=done<ACTIVE().length?`Faltan ${ACTIVE().length-done} por contar`:'Revisar y cerrar'}
  document.querySelectorAll('[data-act="cdcat"]').forEach(c=>{const ps=ACTIVE().filter(p=>p.cat===c.dataset.v);c.textContent=`${CATS[c.dataset.v][0]} · ${ps.filter(p=>S.cd.quedan[p.id]!==undefined&&S.cd.quedan[p.id]!=='').length}/${ps.length}`})}
 if(k.startsWith('ing.qty')){const tot=Object.values(S.ing.qty).reduce((a,b)=>a+(+b||0),0);const cnt=Object.values(S.ing.qty).filter(v=>+v>0).length;document.getElementById('ingtot').textContent=`${cnt} productos · ${tot} unidades`;document.getElementById('ingbtn').disabled=!tot}
 if(k==='pk.n'||k.startsWith('visit.counts')||k.startsWith('plan.'))render();
}
document.addEventListener('input',ev=>{const k=ev.target.dataset.key;if(!k||k==='planAdd')return;let v=ev.target.value;if(ev.target.inputMode==='numeric'){v=v.replace(/\D/g,'');ev.target.value=v}setKey(k,v);if(k!=='pk.n'&&!k.startsWith('visit.counts')&&!k.startsWith('plan.'))after(k)});
document.addEventListener('change',ev=>{
 const pr=ev.target.dataset.prod;
 if(pr){const p=P[pr];
  if(ev.target.dataset.field==='cost'){const v=parseFloat(ev.target.value);const nv=isNaN(v)?null:Math.round(v*100)/100;
   if(nv!==p.cost){p.costLog={by:S.user.name,at:'hoy '+nowT(),old:p.cost};p.cost=nv;S.log.unshift({t:nowT(),txt:h(S.user.name)+' cambió el costo de <b>'+h(p.name)+'</b> a '+(nv==null?'sin costo':money(nv))});toast('Costo de '+h(p.name)+' actualizado')}}
  else{const v=parseInt(ev.target.value);if(v>0)p.pack=v}
  render();return}
 const k=ev.target.dataset.key;if(!k)return;if(k==='np.cat')render();
 if(k==='pk.pid'){S.pk.per=P[S.pk.pid].pack;S.lastBatch=[];render()}
 if(k==='pk.n'){if(!(+S.pk.n>0))S.pk.n='1';render()}
 if(k==='planAdd'&&ev.target.value){S.plan[S.planEdit].items[ev.target.value]='1';render()}
 if(k.startsWith('visit.counts')||k.startsWith('plan.'))render()});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='envscan'){ev.preventDefault();document.querySelector('[data-act="envScan"]').click()}if(ev.key==='Enter'&&ev.target.id==='mancode'){document.querySelector('[data-act="manScan"]').click()}if(ev.key==='Enter'&&ev.target.id==='newitem'){document.querySelector('[data-act="ckAdd"]').click()}});
render();
</script>
